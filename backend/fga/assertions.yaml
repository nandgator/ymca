# The authorization model's test suite, run by `go run ./cmd/fga test`.
#
# Source of truth: A1.6 (tuple shapes and notation) and A1.7 (the assertions
# themselves). A1.8 rule 7 makes the two impossible to drift apart: sync_test.go
# fails if any assertion listed in A1.7 is missing here or carries a different
# expectation, and if fga/model.fga differs from A1.2 by one character.
#
# Tuples are `user relation object`, the order OpenFGA uses and the one A1.6
# now states. Subjects are typed because the type is load-bearing: entitlement
# flows to a `person` — a membership covers a human — while authority is held
# by a `principal`, so that the same human acting personally and acting with
# elevated authority stay distinguishable (ADR-106).
#
# The three assertions under "proof the fixture is not empty" in A1.7 are
# positive twins of DENY assertions below. A negative test against a fixture
# that grants nothing passes for the wrong reason.

# ─────────────────────────────────────────────────────────────
# FIXTURE
# ─────────────────────────────────────────────────────────────

tuples:
  # ── Platform plane ────────────────────────────────────────
  - { user: "principal:platform-op", relation: "operator", object: "platform:main" }

  # ── Bombay · the authorization DAG ────────────────────────
  - { user: "tenant:bombay", relation: "tenant", object: "organizational_unit:bombay" }
  - { user: "tenant:bombay", relation: "tenant", object: "organizational_unit:bombay/procter" }
  - { user: "organizational_unit:bombay", relation: "auth_parent", object: "organizational_unit:bombay/procter" }
  - { user: "tenant:bombay", relation: "tenant", object: "organizational_unit:bombay/procter/sub-unit" }
  - { user: "organizational_unit:bombay/procter", relation: "auth_parent", object: "organizational_unit:bombay/procter/sub-unit" }
  - { user: "tenant:bombay", relation: "tenant", object: "organizational_unit:bombay/pe-dept" }
  - { user: "organizational_unit:bombay", relation: "auth_parent", object: "organizational_unit:bombay/pe-dept" }

  # ── Bombay · principals ───────────────────────────────────
  - { user: "principal:alice", relation: "member", object: "tenant:bombay" }
  # Alice's member_read is NOT here. She holds it as Branch Secretary, and
  # the role path is contextual — see the block below.
  - { user: "principal:procter-admin", relation: "admin", object: "organizational_unit:bombay/procter" }
  # Held at the tenant-level unit, so that the unit_close DENY below tests
  # per-permission propagation (ADR-014) rather than an absent grant.
  - { user: "principal:bombay-secretary", relation: "member_read", object: "organizational_unit:bombay" }
  - { user: "principal:warden", relation: "may_record_for_other", object: "consumption_type:bombay/dinner" }
  - { user: "principal:pe-head", relation: "manager", object: "resource:bombay/procter-pool" }
  - { user: "principal:bombay-finance", relation: "finance_reader", object: "tenant:bombay" }
  # Break-glass, on the ELEVATED principal. Expiry lives in PostgreSQL.
  - { user: "principal:bob-elevated", relation: "jit_grantee", object: "tenant:bombay" }
  # Tenant-level admin, distinct from procter-admin's unit-level grant above.
  # Needed for the platform-plane invariant 9 reverse direction and for
  # may_register_person's direct (non-role) route. ADR-113, ADR-114
  - { user: "principal:bombay-admin", relation: "admin", object: "tenant:bombay" }

  # ── Bombay · Alice's membership and entitlements ──────────
  - { user: "principal:alice", relation: "principal", object: "person:alice" }
  - { user: "tenant:bombay", relation: "tenant", object: "membership:m-123" }
  - { user: "person:alice", relation: "holder", object: "membership:m-123" }

  - { user: "tenant:bombay", relation: "tenant", object: "entitlement_bundle:pool-access" }
  - { user: "membership:m-123", relation: "membership", object: "subscription:sub-77" }
  - { user: "subscription:sub-77", relation: "via_subscription", object: "entitlement_bundle:pool-access" }

  - { user: "tenant:bombay", relation: "tenant", object: "entitlement_bundle:mess-access" }
  - { user: "membership:m-123", relation: "membership", object: "subscription:sub-88" }
  - { user: "subscription:sub-88", relation: "via_subscription", object: "entitlement_bundle:mess-access" }

  # ── Bombay · entitlement conferred BY THE PLAN ────────────
  # The Poona and Bombay shape: the category fee includes the facility,
  # and the plan grants the bundle. One tuple per plan-bundle, one per
  # membership. Amending what a category includes moves every member on
  # it without touching a single member's tuples.
  - { user: "tenant:bombay", relation: "tenant", object: "membership_plan:bombay/metropolitan" }
  - { user: "tenant:bombay", relation: "tenant", object: "membership_plan:bombay/junior" }
  - { user: "tenant:bombay", relation: "tenant", object: "entitlement_bundle:gym-access" }
  - { user: "membership_plan:bombay/metropolitan", relation: "via_plan", object: "entitlement_bundle:gym-access" }
  - { user: "membership:m-123#covered", relation: "covered_member", object: "membership_plan:bombay/metropolitan" }
  - { user: "tenant:bombay", relation: "tenant", object: "resource:bombay/procter-gym" }
  - { user: "organizational_unit:bombay/procter", relation: "auth_parent", object: "resource:bombay/procter-gym" }
  - { user: "entitlement_bundle:gym-access#beneficiary", relation: "entitled", object: "resource:bombay/procter-gym" }

  # A second member, on a category that does NOT include the gym.
  - { user: "tenant:bombay", relation: "tenant", object: "membership:m-456" }
  - { user: "person:dilip", relation: "holder", object: "membership:m-456" }
  - { user: "membership:m-456#covered", relation: "covered_member", object: "membership_plan:bombay/junior" }

  # ── Bombay · resource, with two authorization parents ─────
  - { user: "tenant:bombay", relation: "tenant", object: "resource:bombay/procter-pool" }
  - { user: "organizational_unit:bombay/procter", relation: "auth_parent", object: "resource:bombay/procter-pool" }
  - { user: "organizational_unit:bombay/pe-dept", relation: "auth_parent", object: "resource:bombay/procter-pool" }
  - { user: "entitlement_bundle:pool-access#beneficiary", relation: "entitled", object: "resource:bombay/procter-pool" }

  # ── Bombay · consumption ──────────────────────────────────
  - { user: "tenant:bombay", relation: "tenant", object: "consumption_type:bombay/dinner" }
  - { user: "organizational_unit:bombay/procter", relation: "auth_parent", object: "consumption_type:bombay/dinner" }
  - { user: "entitlement_bundle:mess-access#beneficiary", relation: "entitled", object: "consumption_type:bombay/dinner" }

  # ── Bombay · finance ──────────────────────────────────────
  - { user: "tenant:bombay", relation: "tenant", object: "invoice:bombay/inv-1" }

  # ── The affiliation india → bombay ────────────────────────
  # natl-sec holds ALL FIVE authority verbs. This is the strong form of
  # invariant 2: not a body with one verb, but a body with every verb,
  # still reaching nothing.
  - { user: "tenant:india", relation: "from_tenant", object: "affiliation:india-bombay" }
  - { user: "tenant:bombay", relation: "to_tenant", object: "affiliation:india-bombay" }
  - { user: "principal:natl-sec", relation: "may_set_policy", object: "affiliation:india-bombay" }
  - { user: "principal:natl-sec", relation: "may_review_compliance", object: "affiliation:india-bombay" }
  - { user: "principal:natl-sec", relation: "may_sanction", object: "affiliation:india-bombay" }
  - { user: "principal:natl-sec", relation: "may_administer", object: "affiliation:india-bombay" }
  - { user: "principal:natl-sec", relation: "may_read_member_data", object: "affiliation:india-bombay" }

  # ── Pune · a second real tenant ───────────────────────────
  # Fully populated on purpose. Invariant 1 is about Alice failing to reach
  # something that genuinely exists and that a Pune member genuinely reaches.
  - { user: "tenant:pune", relation: "tenant", object: "organizational_unit:pune/central" }
  - { user: "principal:priya", relation: "member_read", object: "organizational_unit:pune/central" }
  - { user: "principal:priya", relation: "principal", object: "person:priya" }
  - { user: "tenant:pune", relation: "tenant", object: "membership:pune-m-1" }
  - { user: "person:priya", relation: "holder", object: "membership:pune-m-1" }
  - { user: "tenant:pune", relation: "tenant", object: "entitlement_bundle:pune-access" }
  - { user: "membership:pune-m-1", relation: "membership", object: "subscription:pune-sub-1" }
  - { user: "subscription:pune-sub-1", relation: "via_subscription", object: "entitlement_bundle:pune-access" }
  - { user: "tenant:pune", relation: "tenant", object: "resource:pune/central-pool" }
  - { user: "organizational_unit:pune/central", relation: "auth_parent", object: "resource:pune/central-pool" }
  - { user: "entitlement_bundle:pune-access#beneficiary", relation: "entitled", object: "resource:pune/central-pool" }
  - { user: "tenant:pune", relation: "tenant", object: "consumption_type:pune/dinner" }
  - { user: "entitlement_bundle:pune-access#beneficiary", relation: "entitled", object: "consumption_type:pune/dinner" }

# ─────────────────────────────────────────────────────────────
# THE ROLE PATH — supplied per check, never written. ADR-109
#
# At runtime internal/authz builds exactly these two shapes from
# PostgreSQL, for the one permission being checked, with the term
# window, the clearance precondition and ACTING cover already
# applied in the SQL. An assignment that is not effective is never
# supplied, so an expired term cannot authorize (ADR-070) without
# any sweeper having to run.
#
# LoadAssertions REFUSES to let any of these appear under `tuples:`.
# A stored role tuple would outlive the term that justified it.
# ─────────────────────────────────────────────────────────────

contextual:
  # Alice is Branch Secretary at Procter; the role confers member_read.
  # Her ALLOW on the sub-unit below therefore travels role -> scope ->
  # auth_parent, which is the whole mechanism in one assertion.
  - { user: "principal:alice", relation: "subject", object: "role_assignment:ra-001" }
  - { user: "role_assignment:ra-001#holder", relation: "member_read", object: "organizational_unit:bombay/procter" }

  # A finance role at the tenant, to prove finance_reader is role-reachable.
  - { user: "principal:bombay-treasurer", relation: "subject", object: "role_assignment:ra-002" }
  - { user: "role_assignment:ra-002#holder", relation: "finance_reader", object: "tenant:bombay" }

  # Front desk holds may_register_person by role, not by being tenant admin —
  # the ordinary case of 05.3.4: whoever takes the application registers the
  # person; admitting them is a separate permission. ADR-114
  - { user: "principal:frontdesk", relation: "subject", object: "role_assignment:ra-003" }
  - { user: "role_assignment:ra-003#holder", relation: "may_register_person", object: "tenant:bombay" }

  - { user: "principal:mallory", relation: "subject", object: "role_assignment:ra-666" }

# ─────────────────────────────────────────────────────────────
# FORBIDDEN — tuples the MODEL ITSELF must refuse. ADR-078, ADR-110
#
# The grantable set is a decision about which permissions a tenant
# may delegate through a role. It is enforced by the type
# restrictions in A1.2: a relation is role-grantable if and only if
# `role_assignment#holder` appears in its type restriction.
#
# These lines claim relations that are deliberately NOT in that set.
# Each must be REJECTED by OpenFGA as a type violation — not merely
# denied. A DENY would mean the tuple was accepted and happened not
# to resolve, which is one careless edit away from resolving. A
# rejection means it cannot be written at all.
# ─────────────────────────────────────────────────────────────

forbidden:
  # A role may not make anyone the tenant owner, nor an admin — that is
  # the privilege-escalation route ADR-078 forbids, and admin propagates
  # through the whole DAG (ADR-014).
  - { user: "role_assignment:ra-666#holder", relation: "owner", object: "tenant:bombay" }
  - { user: "role_assignment:ra-666#holder", relation: "admin", object: "tenant:bombay" }
  # Nor may a role confer membership or entitlement. Those reach a person
  # through a membership, never through a job (A1.5).
  - { user: "role_assignment:ra-666#holder", relation: "member", object: "tenant:bombay" }
  - { user: "role_assignment:ra-666#holder", relation: "may_use", object: "resource:bombay/procter-pool" }

# ─────────────────────────────────────────────────────────────
# ASSERTIONS
# ─────────────────────────────────────────────────────────────

assertions:
  # ── A1.7 · Must ALLOW ─────────────────────────────────────

  - name: "alice may_use the Procter pool"
    user: "person:alice"
    relation: "may_use"
    object: "resource:bombay/procter-pool"
    expect: true

  - name: "alice may_record her own dinner"
    user: "person:alice"
    relation: "may_record"
    object: "consumption_type:bombay/dinner"
    expect: true

  - name: "the warden may record dinner for someone else"
    user: "principal:warden"
    relation: "may_record_for_other"
    object: "consumption_type:bombay/dinner"
    expect: true

  - name: "the platform operator may provision a tenant"
    user: "principal:platform-op"
    relation: "may_provision_tenant"
    object: "platform:main"
    expect: true

  - name: "alice may read members at Procter"
    user: "principal:alice"
    relation: "member_read"
    object: "organizational_unit:bombay/procter"
    expect: true

  - name: "member_read propagates down the DAG to a sub-unit"
    user: "principal:alice"
    relation: "member_read"
    object: "organizational_unit:bombay/procter/sub-unit"
    expect: true

  - name: "pe-head may close the pool as its direct manager"
    user: "principal:pe-head"
    relation: "may_close"
    object: "resource:bombay/procter-pool"
    expect: true

  - name: "procter-admin may close the pool through auth_parent"
    user: "principal:procter-admin"
    relation: "may_close"
    object: "resource:bombay/procter-pool"
    expect: true

  - name: "natl-sec may sanction the affiliation"
    user: "principal:natl-sec"
    relation: "may_sanction"
    object: "affiliation:india-bombay"
    expect: true

  - name: "natl-sec holds may_administer ON the affiliation"
    user: "principal:natl-sec"
    relation: "may_administer"
    object: "affiliation:india-bombay"
    expect: true

  - name: "break-glass reaches tenant administration"
    user: "principal:bob-elevated"
    relation: "administered_by"
    object: "tenant:bombay"
    expect: true

  - name: "a plan's own bundle entitles the members on that plan"
    user: "person:alice"
    relation: "may_use"
    object: "resource:bombay/procter-gym"
    expect: true

  - name: "one person holds both routes at once — plan gym and subscription pool"
    user: "person:alice"
    relation: "may_use"
    object: "resource:bombay/procter-pool"
    expect: true

  - name: "a member on another category does not reach the gym"
    user: "person:dilip"
    relation: "may_use"
    object: "resource:bombay/procter-gym"
    expect: false

  - name: "the plan route does not leak the subscription's bundle"
    user: "person:dilip"
    relation: "may_use"
    object: "resource:bombay/procter-pool"
    expect: false

  # ── A1.7 · proof the fixture is not empty ──

  - name: "bombay-secretary DOES reach Procter for member_read"
    user: "principal:bombay-secretary"
    relation: "member_read"
    object: "organizational_unit:bombay/procter"
    expect: true

  - name: "a finance reader IS a viewer of the invoice"
    user: "principal:bombay-finance"
    relation: "viewer"
    object: "invoice:bombay/inv-1"
    expect: true

  - name: "a Pune member DOES reach the Pune pool"
    user: "person:priya"
    relation: "may_use"
    object: "resource:pune/central-pool"
    expect: true

  # ── A1.7 · may_register_person, direct and via role (ADR-114) ──

  - name: "the tenant admin may register a person"
    user: "principal:bombay-admin"
    relation: "may_register_person"
    object: "tenant:bombay"
    expect: true

  - name: "front desk may register a person, by role, without being tenant admin"
    user: "principal:frontdesk"
    relation: "may_register_person"
    object: "tenant:bombay"
    expect: true

  - name: "a plain member may not register a person"
    user: "principal:alice"
    relation: "may_register_person"
    object: "tenant:bombay"
    expect: false

  # ── A1.7 · Invariant 2 — the central claim of the design ──
  # natl-sec holds all five verbs and reaches nothing.

  - name: "invariant 2 — no path to member records"
    user: "principal:natl-sec"
    relation: "member_read"
    object: "organizational_unit:bombay/procter"
    expect: false

  - name: "invariant 2 — no path to resources"
    user: "principal:natl-sec"
    relation: "may_use"
    object: "resource:bombay/procter-pool"
    expect: false

  - name: "invariant 2 — no path to finances"
    user: "principal:natl-sec"
    relation: "viewer"
    object: "invoice:bombay/inv-1"
    expect: false

  - name: "invariant 2 — no path to unit administration"
    user: "principal:natl-sec"
    relation: "admin"
    object: "organizational_unit:bombay/procter"
    expect: false

  - name: "invariant 2 — may_administer on the affiliation is NOT tenant administration"
    user: "principal:natl-sec"
    relation: "administered_by"
    object: "tenant:bombay"
    expect: false

  - name: "invariant 2 — authority does not make you a member"
    user: "principal:natl-sec"
    relation: "member"
    object: "tenant:bombay"
    expect: false

  - name: "invariant 2 — no path to finance reading"
    user: "principal:natl-sec"
    relation: "finance_reader"
    object: "tenant:bombay"
    expect: false

  - name: "invariant 2 — no path to safeguarding"
    user: "principal:natl-sec"
    relation: "safeguarding_reader"
    object: "tenant:bombay"
    expect: false

  - name: "invariant 2 — no path to recording consumption"
    user: "principal:natl-sec"
    relation: "may_record"
    object: "consumption_type:bombay/dinner"
    expect: false

  # ── A1.7 · Invariant 9 — platform admin reaches no tenant object ──

  - name: "invariant 9 — platform operator reads no member records"
    user: "principal:platform-op"
    relation: "member_read"
    object: "organizational_unit:bombay/procter"
    expect: false

  - name: "invariant 9 — platform operator reads no invoices"
    user: "principal:platform-op"
    relation: "viewer"
    object: "invoice:bombay/inv-1"
    expect: false

  - name: "invariant 9 — platform operator uses no resources"
    user: "principal:platform-op"
    relation: "may_use"
    object: "resource:bombay/procter-pool"
    expect: false

  - name: "invariant 9, reverse — a tenant admin reaches no platform object"
    user: "principal:bombay-admin"
    relation: "may_provision_tenant"
    object: "platform:main"
    expect: false

  # ── A1.7 · Invariant 1 — no cross-tenant leakage ──

  - name: "invariant 1 — alice does not reach the Pune pool"
    user: "person:alice"
    relation: "may_use"
    object: "resource:pune/central-pool"
    expect: false

  - name: "invariant 1 — alice does not read Pune members"
    user: "principal:alice"
    relation: "member_read"
    object: "organizational_unit:pune/central"
    expect: false

  - name: "invariant 1 — alice does not record Pune dinner"
    user: "person:alice"
    relation: "may_record"
    object: "consumption_type:pune/dinner"
    expect: false

  # ── A1.7 · Entitlement does not confer recording for others ──

  - name: "entitlement is not authority over other people"
    user: "principal:alice"
    relation: "may_record_for_other"
    object: "consumption_type:bombay/dinner"
    expect: false

  # ── A1.7 · Per-permission propagation (ADR-014) ──

  - name: "unit_close does not propagate down the DAG"
    user: "principal:bombay-secretary"
    relation: "unit_close"
    object: "organizational_unit:bombay/procter"
    expect: false

  # ── A1.7 · A personal principal holds no elevated authority ──

  - name: "the personal principal is not the elevated one"
    user: "principal:bob-personal"
    relation: "administered_by"
    object: "tenant:bombay"
    expect: false
