version: "3.9"

# Production stack for a single EC2 instance. Differences from
# docker-compose.yml (local dev):
#   - real secrets via .env.prod (see .env.prod.example), not hardcoded
#   - only 0001_init.sql is applied — NOT 0002_seed.sql, so no demo data
#     ends up in a real deployment
#   - postgres and backend are not published to the host at all — only
#     Caddy is, and it terminates TLS and proxies internally
#   - Caddy gets automatic HTTPS (Let's Encrypt) from just a domain name

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../backend/db/migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PORT: 8080
    # No `ports:` here on purpose — only reachable from other containers on
    # this compose network (i.e. from caddy below).

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pg_data:
  caddy_data:
  caddy_config:
